const fmt = (s) => {
  if (!s) return "";
  const [y,m,d] = s.split("-");
  const M = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  return `${parseInt(d)} ${M[parseInt(m)-1]} ${y}`;
};

const priColor = (p, vars) => {
  if (p === "critico")    return "var(--crit)";
  if (p === "urgente")    return "var(--danger)";
  if (p === "importante") return "var(--accent)";
  return "var(--border2)";
};

  // Filtros
  const [q, setQ] = useState("");
  const [filtroCat, setFiltroCat] = useState("todas");
  const [filtroFechaD, setFiltroFechaD] = useState("");
  const [filtroFechaH, setFiltroFechaH] = useState("");
  const [filtroEtiqueta, setFiltroEtiqueta] = useState("");
  const [filtroPrioridad, setFiltroPrioridad] = useState("todas");

  // Modales
  const [mLogin, setMLogin] = useState(false);
  const [mPub, setMPub] = useState(false);
  const [mEvento, setMEvento] = useState(false);
  const [detalle, setDetalle] = useState(null);
  const [editId, setEditId] = useState(null);
  const [pass, setPass] = useState("");
  const [passErr, setPassErr] = useState("");
  const [avisoBar, setAvisoBar] = useState(true);

  // Forms
  const pubZ = { titulo:"", categoria:"noticias", autor:"", fecha:HOY, contenido:"", fijada:false, prioridad:"normal", activa:true, etiquetas:[], adjuntos:[] };
  const evZ  = { titulo:"", fecha:"", hora:"", lugar:"", descripcion:"" };
  const [fPub, setFPub] = useState(pubZ);
  const [fEv,  setFEv]  = useState(evZ);

  // ── Estados Servicios / Orden del Día ──
  const TIPOS_SERVICIO = ["Guardia","Facción","Servicio de Cuartel","Turno Especial","Instrucción","Comisión"];
  const ESCUADRONES = ["Escuadrón A","Escuadrón B","Escuadrón C","Sin asignar"];
  const svcZ = { nombre:"", rut:"", escuadron:"Escuadrón A", tipoServicio:"Guardia", horaInicio:"08:00", horaTermino:"16:00", lugar:"", obs:"" };
  const ordZ = { fecha:HOY, encuadre:"07:30", instruccion:"", novedad:"Sin novedad.", firmante:"", grado:"" };
  const [servicios, setServicios]   = useState([]);
  const [mSvc, setMSvc]             = useState(false);
  const [editSvcId, setEditSvcId]   = useState(null);
  const [fSvc, setFSvc]             = useState(svcZ);
  const [ordenDia, setOrdenDia]     = useState({ ...ordZ });
  const [editOrden, setEditOrden]   = useState(false);
  const [filtroEsc, setFiltroEsc]   = useState("todos");
  const [filtroTipo, setFiltroTipo] = useState("todos");

  const docSvcZ = { titulo:"", descripcion:"", fecha:HOY, autor:"", archivo:null };
  const [docsSvc, setDocsSvc]       = useState([]);
  const [mDocSvc, setMDocSvc]       = useState(false);
  const [fDocSvc, setFDocSvc]       = useState(docSvcZ);
  // Aplicar tema
  useEffect(() => {
    const t = dark ? TEMA.oscuro : TEMA.claro;
    Object.entries(t).forEach(([k,v]) => document.documentElement.style.setProperty(k,v));
  }, [dark]);

  // Cargar datos
  useEffect(() => {
    DB.getPubs().then(setPubs);
    DB.getEventos().then(setEventos);
  }, []);

  // ── Derivados ──
  const pubsActivas = useMemo(() =>
    pubs.filter(p => p.activa).sort((a,b) => {
      const ord = { critico:0, urgente:1, importante:2, normal:3 };
      if (a.fijada !== b.fijada) return a.fijada ? -1 : 1;
      if (ord[a.prioridad] !== ord[b.prioridad]) return ord[a.prioridad] - ord[b.prioridad];
      return new Date(b.fecha) - new Date(a.fecha);
    }), [pubs]);

  const pubsFiltradas = useMemo(() => {
    let lista = pubsActivas;
    if (filtroCat !== "todas") lista = lista.filter(p => p.categoria === filtroCat);
    if (filtroPrioridad !== "todas") lista = lista.filter(p => p.prioridad === filtroPrioridad);
    if (filtroEtiqueta) lista = lista.filter(p => p.etiquetas?.includes(filtroEtiqueta));
    if (filtroFechaD) lista = lista.filter(p => p.fecha >= filtroFechaD);
    if (filtroFechaH) lista = lista.filter(p => p.fecha <= filtroFechaH);
    if (q.trim()) {
      const ql = q.toLowerCase();
      lista = lista.filter(p =>
        p.titulo.toLowerCase().includes(ql) ||
        p.contenido.toLowerCase().includes(ql) ||
        p.autor.toLowerCase().includes(ql) ||
        p.etiquetas?.some(e => e.toLowerCase().includes(ql))
      );
    }
    return lista;
  }, [pubsActivas, filtroCat, filtroPrioridad, filtroEtiqueta, filtroFechaD, filtroFechaH, q]);

  const prox = useMemo(() =>
    eventos.filter(e => e.fecha >= HOY).sort((a,b) => a.fecha.localeCompare(b.fecha))
  , [eventos]);

  const avisoTop = pubs.find(p => p.prioridad === "critico" && p.activa && p.fijada);

  // Métricas
  const metricas = useMemo(() => ({
    total:    pubsActivas.length,
    noticias: pubsActivas.filter(p => p.categoria === "noticias").length,
    proxEvs:  prox.length,
    urgentes: pubsActivas.filter(p => p.prioridad === "urgente" || p.prioridad === "critico").length,
    docs:     pubsActivas.filter(p => p.categoria === "documentos").length,
  }), [pubsActivas, prox]);

  // ── CRUD ──
  const login = () => {
    if (pass === ADMIN_PASS) { setEsAdmin(true); setMLogin(false); setPass(""); setPassErr(""); setSec("admin"); }
    else setPassErr("Contraseña incorrecta.");
  };

  const guardarPub = async () => {
    if (!fPub.titulo || !fPub.contenido) return;
    const saved = await DB.savePub(editId ? { ...fPub, id: editId } : fPub);
    setPubs(prev => editId ? prev.map(p => p.id === editId ? saved : p) : [saved, ...prev]);
    setMPub(false); setFPub(pubZ); setEditId(null);
  };

  const eliminarPub = async (id) => {
    if (!confirm("¿Eliminar publicación?")) return;
    await DB.deletePub(id);
    setPubs(prev => prev.filter(p => p.id !== id));
  };

  const togglePub = (id, campo) =>
    setPubs(prev => prev.map(p => p.id === id ? { ...p, [campo]: !p[campo] } : p));

  const guardarEv = async () => {
    if (!fEv.titulo || !fEv.fecha) return;
    const saved = await DB.saveEvento(editId === "ev" ? fEv : fEv);
    setEventos(prev => editId === "ev" ? prev.map(e => e.id === fEv.id ? saved : e) : [...prev, saved]);
    setMEvento(false); setFEv(evZ); setEditId(null);
  };

  const eliminarEv = async (id) => {
    if (!confirm("¿Eliminar evento?")) return;
    await DB.deleteEvento(id);
    setEventos(prev => prev.filter(e => e.id !== id));
  };

  const abrirEditPub = (p) => { setFPub({...p}); setEditId(p.id); setMPub(true); };
  const abrirEditEv  = (e) => { setFEv({...e});  setEditId("ev"); setMEvento(true); };

  // ── CRUD Servicios ──
  const guardarSvc = () => {
    if (!fSvc.nombre) return;
    if (editSvcId) {
      setServicios(prev => prev.map(s => s.id === editSvcId ? {...fSvc, id:editSvcId} : s));
    } else {
      setServicios(prev => [...prev, {...fSvc, id:Date.now()}]);
    }
    setMSvc(false); setFSvc(svcZ); setEditSvcId(null);
  };
  const eliminarSvc = (id) => { if (confirm("¿Eliminar servicio?")) setServicios(prev=>prev.filter(s=>s.id!==id)); };
  const abrirEditSvc = (s) => { setFSvc({...s}); setEditSvcId(s.id); setMSvc(true); };

  // ── CRUD Documentos Servicios ──
  const guardarDocSvc = () => {
    if (!fDocSvc.titulo || !fDocSvc.archivo) return;
    setDocsSvc(prev => [...prev, { ...fDocSvc, id: Date.now() }]);
    setMDocSvc(false); setFDocSvc(docSvcZ);
  };
  const eliminarDocSvc = (id) => { if (confirm('¿Eliminar documento?')) setDocsSvc(prev => prev.filter(d => d.id !== id)); };

  const svcFiltrados = useMemo(() => {
    let lista = servicios;
    if (filtroEsc !== "todos")  lista = lista.filter(s => s.escuadron === filtroEsc);
    if (filtroTipo !== "todos") lista = lista.filter(s => s.tipoServicio === filtroTipo);
    return lista;
  }, [servicios, filtroEsc, filtroTipo]);

  const toggleEtiqueta = (et) =>
    setFPub(p => ({ ...p, etiquetas: p.etiquetas.includes(et)
      ? p.etiquetas.filter(x => x !== et)
      : [...p.etiquetas, et]
    }));

  const filtrosActivos = filtroCat !== "todas" || filtroPrioridad !== "todas" || filtroEtiqueta || filtroFechaD || filtroFechaH || q;
  const limpiarFiltros = () => { setQ(""); setFiltroCat("todas"); setFiltroPrioridad("todas"); setFiltroEtiqueta(""); setFiltroFechaD(""); setFiltroFechaH(""); };

  const NAV = [
    { id:"inicio", lbl:"Inicio" },
    { id:"publicaciones", lbl:"Publicaciones" },
    { id:"calendario", lbl:"Calendario" },
    { id:"documentos", lbl:"Documentos" },
    { id:"servicios", lbl:"Servicios" },
  ];

  // ═══════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════

    <div style={{ background:"var(--bg)", color:"var(--text)", minHeight:"100vh", fontFamily:"'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif", transition:"background .25s,color .25s" }}>

      )}

      {/* ── HEADER ── */}
      <header style={{ background:"var(--header-bg)", color:"var(--header-text)", position:"sticky", top:0, zIndex:100, boxShadow:"0 2px 16px var(--shadow)" }}>
        <div style={{ maxWidth:1140, margin:"0 auto", padding:"0 18px", display:"flex", alignItems:"center", justifyContent:"space-between", height:58 }}>

          {/* Marca */}
          <div style={{ display:"flex", alignItems:"center", gap:14, cursor:"pointer" }} onClick={()=>setSec("inicio")}>
            <div style={{
                width:46, height:46, borderRadius:"50%",
                background:"var(--accent)", color:"#fff",
                display:"flex", alignItems:"center", justifyContent:"center",
                fontWeight:900, fontSize:"1.15rem", letterSpacing:".05em",
                flexShrink:0, border:"2px solid #c9a84c",
                boxShadow:"0 0 8px rgba(201,168,76,0.35)"
              }}>EF</div>
            <div>
              <div style={{ fontSize:".6rem", letterSpacing:".22em", color:"var(--accent2)", fontFamily:"monospace", lineHeight:1 }}>ESFOCAR · CONCEPCIÓN</div>
              <div style={{ fontSize:".98rem", fontWeight:700, letterSpacing:".04em", lineHeight:1.2 }}>Diario Mural</div>
            </div>
          </div>

          {/* Nav desktop */}
          <nav style={{ display:"flex", gap:4, alignItems:"center" }} className="nav-d">
            {NAV.map(n => (
              <button key={n.id} onClick={()=>setSec(n.id)} style={{
                ...css.navBtn,
                background: sec===n.id ? "var(--accent3)" : "transparent",
                color: sec===n.id ? "var(--accent2)" : "var(--header-text)",
                border: sec===n.id ? "1px solid var(--accent)" : "1px solid transparent",
              }}>{n.lbl}</button>
            ))}
            {esAdmin && (
              <button onClick={()=>setSec("admin")} style={{
                ...css.navBtn,
                background: sec==="admin" ? "var(--accent3)" : "transparent",
                color: "var(--accent2)",
                border:"1px solid var(--accent)"
              }}>⚙ Admin</button>
            )}
            <button onClick={()=>setDark(d=>!d)} title="Modo oscuro" style={{ ...css.iconBtn, marginLeft:6, fontSize:"1rem", opacity:.75 }}>
              {dark ? "☀" : "◑"}
            </button>
            {esAdmin
              ? <button onClick={()=>setEsAdmin(false)} style={{ ...css.navBtn, color:"var(--danger)", border:"1px solid var(--danger)", marginLeft:4 }}>Salir</button>
              : <button onClick={()=>setMLogin(true)} style={{ ...css.navBtn, border:"1px solid var(--accent)", color:"var(--accent2)", marginLeft:4 }}>🔐 Admin</button>
            }
          </nav>

          {/* Hamburguesa */}
          <div style={{ display:"flex", gap:8 }} className="nav-m">
            <button onClick={()=>setDark(d=>!d)} style={{ ...css.iconBtn, fontSize:"1rem" }}>{dark?"☀":"◑"}</button>
            <button onClick={()=>setMenuOpen(o=>!o)} style={{ ...css.navBtn, border:"1px solid var(--accent)" }}>☰</button>
          </div>
        </div>

        {/* Menú móvil */}
        {menuOpen && (
          <div style={{ background:"var(--header-bg)", borderTop:"1px solid var(--border)", padding:"8px 18px 14px" }}>
            {[...NAV, ...(esAdmin?[{id:"admin",lbl:"⚙ Admin"}]:[])].map(n => (
              <button key={n.id} onClick={()=>{setSec(n.id);setMenuOpen(false);}} style={{ display:"block", width:"100%", textAlign:"left", background:"none", border:"none", color:"var(--header-text)", padding:"10px 4px", cursor:"pointer", fontSize:".88rem", borderBottom:"1px solid var(--border)" }}>
                {n.lbl}
              </button>
            ))}
            {esAdmin
              ? <button onClick={()=>setEsAdmin(false)} style={{ display:"block", padding:"10px 4px", background:"none", border:"none", color:"var(--danger)", cursor:"pointer", fontSize:".88rem" }}>Cerrar sesión</button>
              : <button onClick={()=>{setMLogin(true);setMenuOpen(false);}} style={{ display:"block", padding:"10px 4px", background:"none", border:"none", color:"var(--accent2)", cursor:"pointer", fontSize:".88rem" }}>🔐 Acceso Admin</button>
            }
          </div>
        )}
      </header>

      {/* ── CONTENIDO ── */}
      <main style={{ maxWidth:1140, margin:"0 auto", padding:"26px 16px 60px" }}>

        {/* ═══ INICIO ═══ */}
        {sec === "inicio" && (
          <>
            {/* Hero */}
            <div style={{ background:"var(--header-bg)", color:"var(--header-text)", borderRadius:4, padding:"36px 36px 32px", marginBottom:24, position:"relative", overflow:"hidden" }}>
              <div style={{ position:"absolute", right:-40, top:-40, width:220, height:220, borderRadius:"50%", background:"var(--accent)", opacity:.06, pointerEvents:"none" }} />
              <div style={{ fontSize:".62rem", letterSpacing:".28em", color:"var(--accent2)", fontFamily:"monospace", marginBottom:10 }}>
                ESCUELA DE FORMACIÓN DE CARABINEROS — CONCEPCIÓN
              </div>
              <h1 style={{ fontSize:"1.9rem", fontWeight:700, margin:"0 0 8px", lineHeight:1.2 }}>
                Diario Mural<br />
                <span style={{ fontSize:"1rem", fontWeight:400, color:"var(--accent)" }}>Grupo Concepción</span>
              </h1>
              <p style={{ fontSize:".88rem", color:"var(--text2)", lineHeight:1.7, maxWidth:480, margin:"0 0 22px" }}>
                Espacio oficial de información institucional para los alumnos de la Escuela de Formación de Carabineros.
              </p>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
                <button onClick={()=>setSec("publicaciones")} style={css.btnP}>Ver publicaciones</button>
                <button onClick={()=>setSec("calendario")} style={css.btnS}>Calendario →</button>
              </div>
            </div>

            {/* Métricas */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(5,1fr)", gap:12, marginBottom:26 }} className="grid-5">
              {[
                { v:metricas.total,    l:"Publicaciones",    i:"◈" },
                { v:metricas.noticias, l:"Noticias",         i:"◎" },
                { v:metricas.proxEvs,  l:"Próximos eventos", i:"◫" },
                { v:metricas.urgentes, l:"Urgentes/Críticos",i:"▲", red:true },
                { v:metricas.docs,     l:"Documentos",       i:"▣" },
              ].map(m => (
                <div key={m.l} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, padding:"16px 14px", textAlign:"center", borderTop:`3px solid ${m.red?"var(--danger)":"var(--accent)"}` }}>
                  <div style={{ fontSize:"1.1rem", color:m.red?"var(--danger)":"var(--accent)" }}>{m.i}</div>
                  <div style={{ fontSize:"1.7rem", fontWeight:700, color:m.red?"var(--danger)":"var(--text)", lineHeight:1.2 }}>{m.v}</div>
                  <div style={{ fontSize:".68rem", color:"var(--text3)", letterSpacing:".05em", marginTop:2 }}>{m.l}</div>
                </div>
              ))}
            </div>

            {/* Dos columnas */}
            <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr", gap:20 }} className="grid-21">
              <div>
                <SecTitle>Publicaciones recientes</SecTitle>
                <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                  {pubsActivas.slice(0,6).map(p => (
                    <PubCard key={p.id} pub={p} onClick={()=>{setDetalle(p);setSec("detalle");}} />
                  ))}
                </div>
                <button onClick={()=>setSec("publicaciones")} style={{ ...css.btnS, marginTop:14, width:"100%", textAlign:"center" }}>
                  Ver todas →
                </button>
              </div>
              <div>
                <SecTitle>Próximos eventos</SecTitle>
                <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
                  {prox.slice(0,6).map(e => <EvCard key={e.id} ev={e} />)}
                  {prox.length === 0 && <Vacio />}
                </div>
                <button onClick={()=>setSec("calendario")} style={{ ...css.btnS, marginTop:14, width:"100%", textAlign:"center" }}>
                  Ver calendario →
                </button>
              </div>
            </div>
          </>
        )}

        {/* ═══ PUBLICACIONES ═══ */}
        {sec === "publicaciones" && (
          <>
            <SecTitle>Publicaciones</SecTitle>

            {/* Barra de búsqueda */}
            <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, padding:"16px 18px", marginBottom:18 }}>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:12 }}>
                <input
                  placeholder="Buscar por título, contenido, autor o etiqueta…"
                  value={q} onChange={e=>setQ(e.target.value)}
                  style={{ ...css.inp, flex:1, minWidth:200 }}
                />
                <select value={filtroCat} onChange={e=>setFiltroCat(e.target.value)} style={css.sel}>
                  <option value="todas">Todas las categorías</option>
                  {CATS.map(c=><option key={c.id} value={c.id}>{c.icon} {c.label}</option>)}
                </select>
                <select value={filtroPrioridad} onChange={e=>setFiltroPrioridad(e.target.value)} style={css.sel}>
                  <option value="todas">Todas las prioridades</option>
                  {PRIORIDADES.map(p=><option key={p.id} value={p.id}>{p.label}</option>)}
                </select>
              </div>
              <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center" }}>
                <span style={{ fontSize:".72rem", color:"var(--text3)", fontFamily:"monospace" }}>FECHA:</span>
                <input type="date" value={filtroFechaD} onChange={e=>setFiltroFechaD(e.target.value)} style={{ ...css.inp, width:140 }} placeholder="Desde" />
                <span style={{ color:"var(--text3)", fontSize:".8rem" }}>—</span>
                <input type="date" value={filtroFechaH} onChange={e=>setFiltroFechaH(e.target.value)} style={{ ...css.inp, width:140 }} placeholder="Hasta" />
                <span style={{ fontSize:".72rem", color:"var(--text3)", fontFamily:"monospace", marginLeft:8 }}>ETIQUETA:</span>
                <select value={filtroEtiqueta} onChange={e=>setFiltroEtiqueta(e.target.value)} style={css.sel}>
                  <option value="">Todas</option>
                  {ETIQUETAS_PRESET.map(e=><option key={e} value={e}>{e}</option>)}
                </select>
                {filtrosActivos && (
                  <button onClick={limpiarFiltros} style={{ ...css.btnS, padding:"6px 12px", fontSize:".75rem" }}>
                    ✕ Limpiar filtros
                  </button>
                )}
              </div>
            </div>

            {/* Resultados */}
            <div style={{ fontSize:".7rem", color:"var(--text3)", fontFamily:"monospace", marginBottom:12 }}>
              {pubsFiltradas.length} RESULTADO{pubsFiltradas.length !== 1 ? "S" : ""}
            </div>

            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(310px,1fr))", gap:14 }}>
              {pubsFiltradas.map(p => (
                <PubCard key={p.id} pub={p} onClick={()=>{setDetalle(p);setSec("detalle");}} />
              ))}
            </div>
            {pubsFiltradas.length === 0 && <Vacio msg="No se encontraron publicaciones con los filtros seleccionados." />}
          </>
        )}

        {/* ═══ DETALLE ═══ */}
        {sec === "detalle" && detalle && (
          <>
            <button onClick={()=>setSec("publicaciones")} style={{ ...css.btnS, marginBottom:18 }}>← Volver</button>
            <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:4, padding:"32px 36px", borderLeft:`4px solid ${priColor(detalle.prioridad)}` }}>
              <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14, alignItems:"center" }}>
                <CatBadge cat={detalle.categoria} />
                <PriBadge pri={detalle.prioridad} />
                {detalle.fijada && <Tag>#Fijada</Tag>}
                {detalle.etiquetas?.map(e=><Tag key={e}>#{e}</Tag>)}
              </div>
              <h2 style={{ fontSize:"1.45rem", margin:"0 0 10px", color:"var(--text)", lineHeight:1.3 }}>{detalle.titulo}</h2>
              <div style={{ fontSize:".76rem", color:"var(--text3)", marginBottom:26, fontFamily:"monospace" }}>
                {fmt(detalle.fecha)} · {detalle.autor}
              </div>
              <div style={{ fontSize:".92rem", lineHeight:1.85, color:"var(--text2)", whiteSpace:"pre-wrap" }}>{detalle.contenido}</div>

              {/* Adjuntos del detalle */}
              {detalle.adjuntos?.length > 0 && (
                <div style={{ marginTop:22, borderTop:"1px solid var(--border)", paddingTop:16 }}>
                  <div style={{ fontSize:".68rem", letterSpacing:".12em", color:"var(--text3)", fontFamily:"monospace", marginBottom:10 }}>
                    DOCUMENTOS ADJUNTOS ({detalle.adjuntos.length})
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                    {detalle.adjuntos.map((a, i) => (
                      <a key={i} href={a.data} download={a.nombre}
                        style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 14px", background:"var(--bg3)", border:"1px solid var(--border)", borderRadius:3, color:"var(--text)", fontSize:".82rem", textDecoration:"none", cursor:"pointer" }}>
                        <span style={{ fontSize:"1.2rem" }}>
                          {a.tipo?.includes("pdf") ? "📄" : a.tipo?.includes("image") ? "🖼️" : a.tipo?.includes("word") || a.nombre?.endsWith(".docx") || a.nombre?.endsWith(".doc") ? "📝" : a.tipo?.includes("sheet") || a.nombre?.endsWith(".xlsx") ? "📊" : "📎"}
                        </span>
                        <span style={{ flex:1 }}>{a.nombre}</span>
                        <span style={{ color:"var(--text3)", fontSize:".72rem" }}>{(a.tamaño/1024).toFixed(0)} KB</span>
                        <span style={{ color:"var(--accent)", fontSize:".72rem", fontFamily:"monospace" }}>↓ Descargar</span>
                      </a>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </>
        )}

        {/* ═══ CALENDARIO ═══ */}
        {sec === "calendario" && (
          <>
            <SecTitle>Calendario de Actividades</SecTitle>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:18 }} className="grid-21">
              <div>
                <div style={css.subLabel}>PRÓXIMOS</div>
                <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                  {prox.length > 0 ? prox.map(e=><EvCard key={e.id} ev={e} />)
                   : <Vacio msg="Sin próximos eventos." />}
                </div>
              </div>
              <div>
                <div style={css.subLabel}>PASADOS</div>
                <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                  {eventos.filter(e=>e.fecha<HOY).sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(e=>
                    <EvCard key={e.id} ev={e} pasado />
                  )}
                </div>
              </div>
            </div>
          </>
        )}

        {/* ═══ DOCUMENTOS ═══ */}
        {sec === "documentos" && (
          <>
            <SecTitle>Biblioteca de Documentos</SecTitle>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))", gap:14 }}>
              {pubsActivas.filter(p=>p.categoria==="documentos").map(p=>(
                <div key={p.id} onClick={()=>{setDetalle(p);setSec("detalle");}}
                  style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, padding:"18px 20px", cursor:"pointer", borderLeft:"3px solid var(--text3)" }}>
                  <div style={{ fontSize:"1.6rem", marginBottom:8, color:"var(--text3)" }}>▣</div>
                  <div style={{ fontSize:".88rem", fontWeight:600, color:"var(--text)", marginBottom:4, lineHeight:1.35 }}>{p.titulo}</div>
                  <div style={{ fontSize:".7rem", color:"var(--text3)", fontFamily:"monospace" }}>{fmt(p.fecha)} · {p.autor}</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginTop:8 }}>
                    {p.etiquetas?.map(e=><Tag key={e}>#{e}</Tag>)}
                  </div>
                </div>
              ))}
              {pubsActivas.filter(p=>p.categoria==="documentos").length === 0 && <Vacio />}
            </div>
          </>
        )}

        {/* ═══ ADMIN ═══ */}
        {sec === "admin" && esAdmin && (
          <>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:22, flexWrap:"wrap", gap:10 }}>
              <SecTitle>Panel de Administración</SecTitle>
              <div style={{ display:"flex", gap:10 }}>
                <button onClick={()=>{setFPub(pubZ);setEditId(null);setMPub(true);}} style={css.btnP}>+ Publicación</button>
                <button onClick={()=>{setFEv(evZ);setEditId(null);setMEvento(true);}} style={css.btnS}>+ Evento</button>
              </div>
            </div>

            {/* Métricas admin */}
            <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12, marginBottom:26 }} className="grid-5">
              {[
                { v:pubs.length,               l:"Total publicaciones", c:"var(--accent)" },
                { v:pubs.filter(p=>p.activa).length, l:"Activas",       c:"var(--accent)" },
                { v:pubs.filter(p=>!p.activa).length,l:"Inactivas",     c:"var(--text3)" },
                { v:pubs.filter(p=>p.fijada).length, l:"Fijadas",       c:"var(--accent)" },
              ].map(m=>(
                <div key={m.l} style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, padding:"14px 16px", textAlign:"center", borderTop:`3px solid ${m.c}` }}>
                  <div style={{ fontSize:"1.6rem", fontWeight:700, color:m.c }}>{m.v}</div>
                  <div style={{ fontSize:".68rem", color:"var(--text3)", letterSpacing:".05em" }}>{m.l}</div>
                </div>
              ))}
            </div>

            {/* Tabla publicaciones */}
            <div style={{ marginBottom:32 }}>
              <div style={css.subLabel}>PUBLICACIONES</div>
              <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:".8rem" }}>
                  <thead>
                    <tr style={{ background:"var(--bg3)", borderBottom:"1px solid var(--border)" }}>
                      {["Título","Categoría","Prioridad","Fecha","Etiquetas","Estado","Acciones"].map(h=>(
                        <th key={h} style={{ padding:"9px 13px", textAlign:"left", fontSize:".65rem", letterSpacing:".1em", color:"var(--text3)", fontFamily:"monospace", fontWeight:600 }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {pubs.map(p=>(
                      <tr key={p.id} style={{ borderBottom:"1px solid var(--border)", opacity:p.activa?1:.55 }}>
                        <td style={{ padding:"9px 13px", color:"var(--text)", fontWeight:p.fijada?600:400, maxWidth:220 }}>
                          {p.fijada && <span style={{ color:"var(--accent)", marginRight:4 }}>📌</span>}
                          {p.titulo}
                        </td>
                        <td style={{ padding:"9px 13px" }}><CatBadge cat={p.categoria} /></td>
                        <td style={{ padding:"9px 13px" }}><PriBadge pri={p.prioridad} /></td>
                        <td style={{ padding:"9px 13px", fontFamily:"monospace", fontSize:".7rem", color:"var(--text3)" }}>{fmt(p.fecha)}</td>
                        <td style={{ padding:"9px 13px" }}>
                          <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>
                            {p.etiquetas?.slice(0,2).map(e=><Tag key={e}>#{e}</Tag>)}
                            {p.etiquetas?.length > 2 && <Tag>+{p.etiquetas.length-2}</Tag>}
                          </div>
                        </td>
                        <td style={{ padding:"9px 13px" }}>
                          <span style={{ background:p.activa?"var(--accent3)":"var(--bg3)", color:p.activa?"var(--accent)":"var(--text3)", padding:"2px 8px", borderRadius:2, fontSize:".68rem", fontWeight:600, fontFamily:"monospace" }}>
                            {p.activa?"ACTIVA":"INACTIVA"}
                          </span>
                        </td>
                        <td style={{ padding:"9px 13px" }}>
                          <div style={{ display:"flex", gap:5 }}>
                            <button onClick={()=>abrirEditPub(p)} style={css.mini} title="Editar">✏</button>
                            <button onClick={()=>togglePub(p.id,"activa")} style={css.mini} title={p.activa?"Desactivar":"Activar"}>{p.activa?"⊘":"✓"}</button>
                            <button onClick={()=>togglePub(p.id,"fijada")} style={css.mini} title={p.fijada?"Desfijar":"Fijar"}>📌</button>
                            <button onClick={()=>eliminarPub(p.id)} style={{ ...css.mini, color:"var(--danger)" }} title="Eliminar">✕</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Tabla eventos */}
            <div>
              <div style={css.subLabel}>EVENTOS ({eventos.length})</div>
              <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:3, overflowX:"auto" }}>
                <table style={{ width:"100%", borderCollapse:"collapse", fontSize:".8rem" }}>
                  <thead>
                    <tr style={{ background:"var(--bg3)", borderBottom:"1px solid var(--border)" }}>
                      {["Título","Fecha","Hora","Lugar","Acciones"].map(h=>(
                        <th key={h} style={{ padding:"9px 13px", textAlign:"left", fontSize:".65rem", letterSpacing:".1em", color:"var(--text3)", fontFamily:"monospace", fontWeight:600 }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {eventos.map(e=>(
                      <tr key={e.id} style={{ borderBottom:"1px solid var(--border)", opacity:e.fecha<HOY?.7:1 }}>
                        <td style={{ padding:"9px 13px", color:"var(--text)" }}>{e.titulo}</td>
                        <td style={{ padding:"9px 13px", fontFamily:"monospace", fontSize:".7rem", color:"var(--text3)" }}>{fmt(e.fecha)}</td>
                        <td style={{ padding:"9px 13px", fontFamily:"monospace", fontSize:".7rem", color:"var(--text3)" }}>{e.hora}</td>
                        <td style={{ padding:"9px 13px", fontSize:".78rem", color:"var(--text2)" }}>{e.lugar}</td>
                        <td style={{ padding:"9px 13px" }}>
                          <div style={{ display:"flex", gap:5 }}>
                            <button onClick={()=>abrirEditEv(e)} style={css.mini}>✏</button>
                            <button onClick={()=>eliminarEv(e.id)} style={{ ...css.mini, color:"var(--danger)" }}>✕</button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </>
        )}

        {/* ═══ SERVICIOS Y ORDEN DEL DÍA ═══ */}
        {sec === "servicios" && (
          <>
            {/* ── DOCUMENTOS PUBLICADOS ── */}
            <div style={{ marginBottom:28 }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16, flexWrap:"wrap", gap:10 }}>
                <SecTitle>Documentos Publicados</SecTitle>
                {esAdmin && (
                  <button onClick={()=>{ setFDocSvc(docSvcZ); setMDocSvc(true); }} style={css.btnP}>
                    + Subir documento
                  </button>
                )}
              </div>

              {docsSvc.length === 0 ? (
                <Vacio msg={esAdmin ? "Sin documentos. Presiona «+ Subir documento» para publicar un PDF o Word." : "No hay documentos publicados aún."} />
              ) : (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(260px,1fr))", gap:14 }}>
                  {docsSvc.map(d => {
                    const esPDF  = d.archivo?.tipo?.includes("pdf") || d.archivo?.nombre?.endsWith(".pdf");

            <div>
              <div style={{ fontSize:".7rem", color:"var(--text3)", fontFamily:"monospace", marginBottom:7 }}>ETIQUETAS</div>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                {ETIQUETAS_PRESET.map(et=>(
                  <button key={et} onClick={()=>toggleEtiqueta(et)} style={{
                    padding:"3px 10px", borderRadius:2, fontSize:".72rem", cursor:"pointer",
                    background: fPub.etiquetas.includes(et) ? "var(--accent)" : "var(--bg3)",
                    color: fPub.etiquetas.includes(et) ? "#fff" : "var(--text2)",
                    border: `1px solid ${fPub.etiquetas.includes(et) ? "var(--accent2)" : "var(--border)"}`,
                  }}>{et}</button>
                ))}
              </div>
            </div>

            {/* Adjuntos */}
            <div>
              <div style={{ fontSize:".7rem", color:"var(--text3)", fontFamily:"monospace", marginBottom:7 }}>ADJUNTOS (PDF, Word, Imágenes, etc.)</div>
              <input
                type="file"
                multiple
                accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.webp,.gif"
                onChange={e => {
                  const archivos = Array.from(e.target.files);
                  const promesas = archivos.map(f => new Promise(res => {
                    const reader = new FileReader();
                    reader.onload = ev => res({ nombre: f.name, tipo: f.type, tamaño: f.size, data: ev.target.result });
                    reader.readAsDataURL(f);
                  }));
                  Promise.all(promesas).then(nuevos =>
                    setFPub(p => ({ ...p, adjuntos: [...(p.adjuntos || []), ...nuevos] }))
                  );
                  e.target.value = "";
                }}
                style={{ ...css.inp, width:"100%", cursor:"pointer" }}
              />
              {fPub.adjuntos?.length > 0 && (
                <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:5 }}>
                  {fPub.adjuntos.map((a, i) => (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:8, background:"var(--bg3)", padding:"5px 10px", borderRadius:3, fontSize:".75rem" }}>
                      <span style={{ fontSize:"1rem" }}>
                        {a.tipo?.includes("pdf") ? "📄" : a.tipo?.includes("image") ? "🖼️" : a.tipo?.includes("word") || a.nombre?.endsWith(".docx") || a.nombre?.endsWith(".doc") ? "📝" : "📎"}
                      </span>
                      <span style={{ flex:1, color:"var(--text2)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{a.nombre}</span>
                      <span style={{ color:"var(--text3)", marginRight:4 }}>{(a.tamaño/1024).toFixed(0)} KB</span>
                      <button onClick={() => setFPub(p => ({ ...p, adjuntos: p.adjuntos.filter((_,j)=>j!==i) }))}
                        style={{ background:"none", border:"none", color:"var(--danger)", cursor:"pointer", fontSize:".85rem", padding:0 }}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* Checks */}
            <div style={{ display:"flex", gap:18, flexWrap:"wrap" }}>
              {[["fijada","📌 Fijar"],["activa","✅ Activa"]].map(([k,l])=>(
                <label key={k} style={{ display:"flex", alignItems:"center", gap:5, fontSize:".82rem", color:"var(--text2)", cursor:"pointer" }}>
                  <input type="checkbox" checked={fPub[k]} onChange={e=>setFPub(p=>({...p,[k]:e.target.checked}))} />
                  {l}
                </label>
              ))}
            </div>

            <div style={{ display:"flex", gap:10 }}>
              <button onClick={guardarPub} style={{ ...css.btnP, flex:1 }}>Guardar</button>
              <button onClick={()=>{setMPub(false);setFPub(pubZ);setEditId(null);}} style={{ ...css.btnS, flex:1 }}>Cancelar</button>
            </div>
          </div>
        </Modal>
      )}

      {/* ═══ MODAL EVENTO ═══ */}
      {mEvento && (
        <Modal onClose={()=>{setMEvento(false);setFEv(evZ);setEditId(null);}}>
          <h3 style={{ margin:"0 0 18px", fontSize:"1rem", color:"var(--text)" }}>{editId==="ev"?"Editar evento":"Nuevo evento"}</h3>
          <div style={{ display:"flex", flexDirection:"column", gap:11 }}>
            <input placeholder="Título *" value={fEv.titulo} onChange={e=>setFEv(v=>({...v,titulo:e.target.value}))} style={{ ...css.inp, width:"100%" }} />
            <div style={{ display:"flex", gap:10 }}>
              <input type="date" value={fEv.fecha} onChange={e=>setFEv(v=>({...v,fecha:e.target.value}))} style={{ ...css.inp, flex:1 }} />
              <input placeholder="Hora" value={fEv.hora} onChange={e=>setFEv(v=>({...v,hora:e.target.value}))} style={{ ...css.inp, flex:1 }} />
            </div>
            <input placeholder="Lugar" value={fEv.lugar} onChange={e=>setFEv(v=>({...v,lugar:e.target.value}))} style={{ ...css.inp, width:"100%" }} />
            <textarea placeholder="Descripción" value={fEv.descripcion} onChange={e=>setFEv(v=>({...v,descripcion:e.target.value}))}
              style={{ ...css.inp, minHeight:80, resize:"vertical", width:"100%" }} />
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={guardarEv} style={{ ...css.btnP, flex:1 }}>Guardar</button>
              <button onClick={()=>{setMEvento(false);setFEv(evZ);setEditId(null);}} style={{ ...css.btnS, flex:1 }}>Cancelar</button>
            </div>
          </div>
        </Modal>
      )}

      {/* Responsive CSS */}
      <style>{`
        *{box-sizing:border-box;}
        .nav-m{display:none!important;}
        @media(max-width:680px){
          .nav-d{display:none!important;}
          .nav-m{display:flex!important;}
          .grid-5{grid-template-columns:1fr 1fr!important;}
          .grid-21{grid-template-columns:1fr!important;}
        }
        @media(max-width:900px){
          .grid-21{grid-template-columns:1fr!important;}
          .grid-5{grid-template-columns:1fr 1fr 1fr!important;}
        }
        button:hover{opacity:.85;}
        input,select,textarea{transition:border-color .15s;}
        input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-track{background:var(--bg);}
        ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
      `}</style>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// SUB-COMPONENTES
// ═══════════════════════════════════════════════════════════
function SecTitle({ children }) {
  return (
    <div style={{ marginBottom:16 }}>
      <h2 style={{ fontSize:"1rem", margin:0, color:"var(--text)", fontWeight:700, letterSpacing:".04em" }}>{children}</h2>
      <div style={{ height:2, background:"linear-gradient(to right,var(--accent),transparent)", marginTop:5, width:60 }} />
    </div>
  );
}

function PubCard({ pub, onClick }) {
  const leftColor = priColor(pub.prioridad);
  return (
    <div onClick={onClick} style={{
      background:"var(--surface)", border:"1px solid var(--border)",
      borderLeft:`3px solid ${leftColor}`, borderRadius:3,
      padding:"14px 16px", cursor:"pointer", transition:"box-shadow .15s, transform .1s",
    }}
    onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 3px 12px var(--shadow)";e.currentTarget.style.transform="translateY(-1px)";}}
    onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.transform="none";}}>
      <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:7, alignItems:"center" }}>
        <CatBadge cat={pub.categoria} />
        <PriBadge pri={pub.prioridad} />
        {pub.fijada && <span style={{ fontSize:".62rem", fontFamily:"monospace", color:"var(--accent)" }}>📌 FIJADA</span>}
      </div>
      <div style={{ fontSize:".9rem", fontWeight:600, color:"var(--text)", marginBottom:5, lineHeight:1.35 }}>{pub.titulo}</div>
      <div style={{ fontSize:".7rem", color:"var(--text3)", marginBottom:8, fontFamily:"monospace" }}>{fmt(pub.fecha)} · {pub.autor}</div>
      <div style={{ fontSize:".8rem", color:"var(--text2)", lineHeight:1.6,
        overflow:"hidden", display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical" }}>
        {pub.contenido}
      </div>
      {pub.etiquetas?.length > 0 && (
        <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginTop:8 }}>
          {pub.etiquetas.map(e=><Tag key={e}>#{e}</Tag>)}
        </div>
      )}
    </div>
  );
}

function EvCard({ ev, pasado }) {
  return (
    <div style={{
      background:"var(--surface)", border:"1px solid var(--border)",
      borderLeft:`3px solid ${pasado?"var(--border2)":"var(--accent)"}`,
      borderRadius:3, padding:"12px 14px", opacity:pasado?.65:1
    }}>
      <div style={{ fontSize:".86rem", fontWeight:600, color:"var(--text)", marginBottom:3 }}>{ev.titulo}</div>
      <div style={{ fontSize:".7rem", color:"var(--text3)", fontFamily:"monospace" }}>
        {fmt(ev.fecha)}{ev.hora&&ev.hora!=="—"&&` · ${ev.hora}`}
      </div>
      {ev.lugar&&ev.lugar!=="—"&&<div style={{ fontSize:".73rem", color:"var(--text2)", marginTop:3 }}>◎ {ev.lugar}</div>}
      {ev.descripcion&&<div style={{ fontSize:".76rem", color:"var(--text3)", marginTop:4, lineHeight:1.5 }}>{ev.descripcion}</div>}
    </div>
  );
}

function CatBadge({ cat }) {
  const c = CATS.find(x=>x.id===cat);
  if (!c) return null;
  return (
    <span style={{ background:"var(--accent3)", color:"var(--accent)", border:"1px solid var(--accent)", borderRadius:2, fontSize:".65rem", fontWeight:700, padding:"2px 7px", letterSpacing:".06em", fontFamily:"monospace" }}>
      {c.icon} {c.label.toUpperCase()}
    </span>
  );
}

function PriBadge({ pri }) {
  const p = PRIORIDADES.find(x=>x.id===pri);
  if (!p || pri==="normal") return null;
  const colors = { importante:"var(--accent)", urgente:"var(--danger)", critico:"var(--crit)" };
  return (
    <span style={{ background:colors[pri]+"22", color:colors[pri], border:`1px solid ${colors[pri]}`, borderRadius:2, fontSize:".62rem", fontWeight:700, padding:"2px 7px", letterSpacing:".08em", fontFamily:"monospace" }}>
      {p.label.toUpperCase()}
    </span>
  );
}

function TipoBadge({ tipo }) {
  const colores = {
    "Guardia":            "var(--accent)",
    "Facción":            "var(--accent2)",
    "Servicio de Cuartel":"var(--text3)",
    "Turno Especial":     "var(--warn)",
    "Instrucción":        "var(--crit)",
    "Comisión":           "var(--danger)",
  };
  const c = colores[tipo] || "var(--text3)";
  return (
    <span style={{ background:c+"22", color:c, border:`1px solid ${c}`, borderRadius:2, fontSize:".62rem", fontWeight:700, padding:"2px 7px", letterSpacing:".06em", fontFamily:"monospace" }}>
      {tipo?.toUpperCase()}
    </span>
  );
}

function Tag({ children }) {
  return (
    <span style={{ background:"var(--bg3)", color:"var(--text3)", border:"1px solid var(--border)", borderRadius:2, fontSize:".65rem", padding:"1px 6px", fontFamily:"monospace" }}>
      {children}
    </span>
  );
}

function Modal({ children, onClose }) {
  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.55)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16 }}
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{ background:"var(--surface)", border:"1px solid var(--border)", borderRadius:4, padding:"26px 26px", maxWidth:520, width:"100%", maxHeight:"90vh", overflowY:"auto", boxShadow:"0 12px 40px var(--shadow)" }}>
        {children}
      </div>
    </div>
  );
}

function Vacio({ msg = "Sin contenido disponible." }) {
  return <div style={{ color:"var(--text3)", fontSize:".84rem", padding:"20px 0", textAlign:"center" }}>{msg}</div>;
}

// ═══════════════════════════════════════════════════════════
// ESTILOS BASE
// ═══════════════════════════════════════════════════════════
const css = {
  btnP: { background:"var(--accent)", color:"#fff", border:"none", padding:"8px 18px", cursor:"pointer", borderRadius:2, fontSize:".8rem", letterSpacing:".05em", fontFamily:"inherit" },
  btnS: { background:"transparent", color:"var(--accent)", border:"1px solid var(--accent)", padding:"8px 18px", cursor:"pointer", borderRadius:2, fontSize:".8rem", letterSpacing:".05em", fontFamily:"inherit" },
  navBtn: { background:"transparent", border:"none", padding:"6px 14px", cursor:"pointer", fontSize:".78rem", letterSpacing:".06em", borderRadius:2, fontFamily:"inherit", transition:"background .15s" },
  iconBtn: { background:"none", border:"none", cursor:"pointer", color:"inherit", padding:"4px 8px", borderRadius:2 },
  inp: { border:"1px solid var(--border2)", borderRadius:2, padding:"8px 11px", fontSize:".82rem", fontFamily:"inherit", background:"var(--bg)", color:"var(--text)" },
  sel: { border:"1px solid var(--border2)", borderRadius:2, padding:"8px 11px", fontSize:".82rem", fontFamily:"inherit", background:"var(--bg)", color:"var(--text)", cursor:"pointer" },
  mini: { background:"var(--bg3)", border:"1px solid var(--border)", padding:"3px 8px", cursor:"pointer", borderRadius:2, fontSize:".8rem", color:"var(--text2)" },
  subLabel: { fontSize:".65rem", letterSpacing:".18em", color:"var(--text3)", marginBottom:10, fontFamily:"monospace" },
};


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(DiarioMural));

  </script>
</body>
</html>
